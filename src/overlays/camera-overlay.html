<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capto — Floating Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    .cam-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      -webkit-app-region: drag;
      cursor: grab;
      transition: border-radius 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cam-container:active {
      cursor: grabbing;
    }

    /* Perfect Edge Masking with Zero Outlines */
    .cam-container.shape-circle {
      border-radius: 50%;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 99.5%, transparent 100%);
      mask-image: radial-gradient(circle at 50% 50%, #000 99.5%, transparent 100%);
    }

    .cam-container.shape-rounded {
      border-radius: 26px;
    }

    .cam-container.shape-rect {
      border-radius: 12px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      pointer-events: none;
      border-radius: inherit;
      transition: filter 0.1s ease;
      display: block;
      background: transparent !important;
    }

    /* Hover Controls */
    .cam-hover-controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
      -webkit-app-region: no-drag;
      z-index: 10;
    }

    .cam-container:hover .cam-hover-controls {
      opacity: 1;
    }

    .mini-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: white;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .mini-btn:hover {
      transform: scale(1.15);
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="cam-container shape-circle" id="cam-container">
    <video id="camera-feed" autoplay muted playsinline></video>
    
    <div class="cam-hover-controls">
      <button class="mini-btn" id="btn-flip-cam" title="Flip / Mirror Camera (Selfie View)">🪞</button>
      <button class="mini-btn" id="btn-cycle-shape" title="Switch Shape (Circle/Rounded/Square)">🔄</button>
      <button class="mini-btn" id="btn-close-cam" title="Hide Overlay">✖</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('cam-container');
    const video = document.getElementById('camera-feed');
    const btnFlipCam = document.getElementById('btn-flip-cam');
    const btnCycleShape = document.getElementById('btn-cycle-shape');
    const btnCloseCam = document.getElementById('btn-close-cam');

    const shapes = ['circle', 'rounded', 'rect'];
    let currentShapeIndex = 0;
    let isFlipped = true;
    let currentStream = null;
    let isInitializing = false;
    let pendingInit = null;

    function applyFlip() {
      if (video) {
        video.style.transform = isFlipped ? 'scaleX(-1)' : 'none';
      }
    }

    function stopStream() {
      if (currentStream) {
        try {
          currentStream.getTracks().forEach(t => {
            t.stop();
            t.enabled = false;
          });
        } catch (e) {}
        currentStream = null;
      }
      if (video) {
        video.srcObject = null;
      }
    }

    async function initCamera(targetDeviceId = '', targetLabel = '', targetIndex = 0) {
      if (isInitializing) {
        pendingInit = { targetDeviceId, targetLabel, targetIndex };
        return;
      }
      isInitializing = true;

      try {
        stopStream();
        // Give Windows USB and UVC driver 120ms to completely release hardware lock
        await new Promise(r => setTimeout(r, 120));

        let stream = null;

        // 1. Try targetDeviceId first if supplied
        if (targetDeviceId) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                deviceId: { exact: targetDeviceId },
                width: { ideal: 1280 },
                height: { ideal: 720 }
              },
              audio: false
            });
          } catch (e1) {
            try {
              stream = await navigator.mediaDevices.getUserMedia({
                video: {
                  deviceId: { ideal: targetDeviceId }
                },
                audio: false
              });
            } catch (e2) {}
          }
        }

        // 2. If no stream yet, enumerate local devices to match by label or index
        if (!stream) {
          try {
            // Pre-warm camera permission to ensure labels are populated
            let tempStream = null;
            try {
              tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            } catch (te) {}

            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');

            if (tempStream) {
              tempStream.getTracks().forEach(t => t.stop());
            }

            let matched = null;
            if (targetLabel && targetLabel.trim()) {
              const clean = targetLabel.trim().toLowerCase();
              matched = videoDevices.find(d => d.label && d.label.trim().toLowerCase() === clean);
              if (!matched) {
                matched = videoDevices.find(d => d.label && (d.label.toLowerCase().includes(clean) || clean.includes(d.label.toLowerCase())));
              }
            }

            if (!matched && typeof targetIndex === 'number' && videoDevices[targetIndex]) {
              matched = videoDevices[targetIndex];
            }

            if (!matched && videoDevices.length > 0) {
              matched = videoDevices[0];
            }

            if (matched && matched.deviceId) {
              try {
                stream = await navigator.mediaDevices.getUserMedia({
                  video: {
                    deviceId: { exact: matched.deviceId },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                  },
                  audio: false
                });
              } catch (me) {
                stream = await navigator.mediaDevices.getUserMedia({
                  video: {
                    deviceId: { ideal: matched.deviceId }
                  },
                  audio: false
                });
              }
            }
          } catch (e3) {}
        }

        // 3. Fallback to any available video stream
        if (!stream) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 1280 }, height: { ideal: 720 } },
              audio: false
            });
          } catch (e4) {
            console.error('All camera attempts failed in overlay:', e4);
          }
        }

        if (video && stream) {
          currentStream = stream;
          video.srcObject = stream;
          video.play().catch(() => {});
          applyFilters();

          const vTrack = stream.getVideoTracks()[0];
          if (vTrack) {
            vTrack.onended = () => {
              console.warn('Overlay video track ended, reconnecting...');
              setTimeout(() => initCamera(targetDeviceId, targetLabel, targetIndex), 400);
            };
          }
        }
      } catch (err) {
        console.error('Webcam error in camera overlay:', err);
      } finally {
        isInitializing = false;
        if (pendingInit) {
          const next = pendingInit;
          pendingInit = null;
          initCamera(next.targetDeviceId, next.targetLabel, next.targetIndex);
        }
      }
    }

    function setShape(shape) {
      container.className = `cam-container shape-${shape}`;
      const idx = shapes.indexOf(shape);
      if (idx !== -1) currentShapeIndex = idx;
    }

    btnCycleShape.addEventListener('click', (e) => {
      e.stopPropagation();
      currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
      const nextShape = shapes[currentShapeIndex];
      setShape(nextShape);
      if (window.electronAPI && window.electronAPI.setCameraShape) {
        window.electronAPI.setCameraShape(nextShape);
      }
    });

    if (btnFlipCam) {
      btnFlipCam.addEventListener('click', (e) => {
        e.stopPropagation();
        isFlipped = !isFlipped;
        applyFlip();
        if (window.electronAPI && window.electronAPI.setCameraFlipped) {
          window.electronAPI.setCameraFlipped(isFlipped);
        }
      });
    }

    btnCloseCam.addEventListener('click', (e) => {
      e.stopPropagation();
      stopStream();
      if (window.electronAPI && window.electronAPI.closeCameraOverlay) {
        window.electronAPI.closeCameraOverlay();
      }
    });

    window.addEventListener('beforeunload', () => {
      stopStream();
    });

    let camBrightness = 100;
    let camSmoothness = 0;
    let camNoiseReduction = 0;

    function applyFilters() {
      if (!video) return;
      let finalBrightness = camBrightness + (camSmoothness * 0.08) + (camNoiseReduction * 0.06);
      let finalContrast = 100 + (camSmoothness * 0.05) - (camNoiseReduction * 0.08);
      let finalSaturate = 100 + (camSmoothness * 0.12) - (camNoiseReduction * 0.06);
      let microSoftness = (camSmoothness / 100) * 0.25;

      let filters = [`brightness(${finalBrightness.toFixed(1)}%)`];
      if (Math.abs(finalContrast - 100) > 0.5) filters.push(`contrast(${finalContrast.toFixed(1)}%)`);
      if (Math.abs(finalSaturate - 100) > 0.5) filters.push(`saturate(${finalSaturate.toFixed(1)}%)`);
      if (microSoftness > 0.04) filters.push(`blur(${microSoftness.toFixed(2)}px)`);

      video.style.filter = filters.join(' ');
      applyFlip();
    }

    let hasReceivedSettings = false;

    if (window.electronAPI) {
      window.electronAPI.onStopCamFeed(() => {
        stopStream();
      });

      window.electronAPI.onInitCamSettings(({ shape, deviceId, deviceLabel, deviceIndex }) => {
        hasReceivedSettings = true;
        if (shape) setShape(shape);
        initCamera(deviceId || '', deviceLabel || '', deviceIndex || 0);
        applyFilters();
      });

      window.electronAPI.onUpdateCamSettings(({ shape, deviceId, deviceLabel, deviceIndex }) => {
        if (shape) setShape(shape);
        initCamera(deviceId || '', deviceLabel || '', deviceIndex || 0);
      });

      window.electronAPI.onUpdateCamShape((shape) => {
        if (shape) setShape(shape);
      });

      window.electronAPI.onUpdateCamBrightness((val) => {
        camBrightness = val;
        applyFilters();
      });

      window.electronAPI.onUpdateCamFilters(({ brightness, smoothness, noiseReduction }) => {
        if (typeof brightness === 'number') camBrightness = brightness;
        if (typeof smoothness === 'number') camSmoothness = smoothness;
        if (typeof noiseReduction === 'number') camNoiseReduction = noiseReduction;
        applyFilters();
      });

      window.electronAPI.onUpdateCamFlipped((flipped) => {
        isFlipped = !!flipped;
        applyFlip();
      });
    }

    // Safety fallback: only start default camera if no IPC settings received within 350ms
    setTimeout(() => {
      if (!hasReceivedSettings && !currentStream) {
        initCamera();
      }
    }, 350);

  </script>
</body>
</html>
