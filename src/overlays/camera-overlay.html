<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capto — Floating Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    .cam-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      -webkit-app-region: drag;
      cursor: grab;
      transition: border-radius 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cam-container:active {
      cursor: grabbing;
    }

    /* Perfect Edge Masking with Zero Outlines */
    .cam-container.shape-circle {
      border-radius: 50%;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 99.5%, transparent 100%);
      mask-image: radial-gradient(circle at 50% 50%, #000 99.5%, transparent 100%);
    }

    .cam-container.shape-rounded {
      border-radius: 26px;
    }

    .cam-container.shape-rect {
      border-radius: 12px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      pointer-events: none;
      border-radius: inherit;
      transition: filter 0.1s ease;
      display: block;
      background: transparent !important;
    }

    /* Hover Controls */
    .cam-hover-controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
      -webkit-app-region: no-drag;
      z-index: 10;
    }

    .cam-container:hover .cam-hover-controls {
      opacity: 1;
    }

    .mini-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: white;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .mini-btn:hover {
      transform: scale(1.15);
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="cam-container shape-circle" id="cam-container">
    <video id="camera-feed" autoplay muted playsinline></video>
    
    <div class="cam-hover-controls">
      <button class="mini-btn" id="btn-flip-cam" title="Flip / Mirror Camera (Selfie View)">🪞</button>
      <button class="mini-btn" id="btn-cycle-shape" title="Switch Shape (Circle/Rounded/Square)">🔄</button>
      <button class="mini-btn" id="btn-close-cam" title="Hide Overlay">✖</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('cam-container');
    const video = document.getElementById('camera-feed');
    const btnFlipCam = document.getElementById('btn-flip-cam');
    const btnCycleShape = document.getElementById('btn-cycle-shape');
    const btnCloseCam = document.getElementById('btn-close-cam');

    const shapes = ['circle', 'rounded', 'rect'];
    let currentShapeIndex = 0;
    let isFlipped = true;
    let currentStream = null;
    let isInitializing = false;

    function applyFlip() {
      if (video) {
        video.style.transform = isFlipped ? 'scaleX(-1)' : 'none';
      }
    }


    function stopStream() {
      if (currentStream) {
        try {
          currentStream.getTracks().forEach(t => {
            t.stop();
            t.enabled = false;
          });
        } catch (e) {}
        currentStream = null;
      }
      if (video) {
        video.srcObject = null;
      }
    }

    async function initCamera(targetDeviceId = '', targetLabel = '') {
      if (isInitializing) return;
      isInitializing = true;

      try {
        stopStream();
        // Give Windows USB and DroidCam driver 180ms to completely release hardware lock
        await new Promise(r => setTimeout(r, 180));

        // Enumerate local devices in this window to resolve exact local device ID
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');

        let matchedDevice = null;
        if (targetLabel) {
          const cleanLabel = targetLabel.trim().toLowerCase();
          matchedDevice = videoDevices.find(d => d.label && d.label.trim().toLowerCase() === cleanLabel);
          if (!matchedDevice) {
            matchedDevice = videoDevices.find(d => d.label && (d.label.toLowerCase().includes(cleanLabel) || cleanLabel.includes(d.label.toLowerCase())));
          }
        }

        if (!matchedDevice && targetDeviceId) {
          matchedDevice = videoDevices.find(d => d.deviceId === targetDeviceId);
        }

        if (!matchedDevice && videoDevices.length > 0) {
          matchedDevice = videoDevices[0];
        }

        const localId = matchedDevice ? matchedDevice.deviceId : targetDeviceId;

        if (localId) {
          try {
            currentStream = await navigator.mediaDevices.getUserMedia({
              video: {
                deviceId: { exact: localId },
                width: { ideal: 1280 },
                height: { ideal: 720 }
              },
              audio: false
            });
          } catch (e1) {
            console.warn('Exact deviceId failed, attempting ideal:', e1);
            try {
              currentStream = await navigator.mediaDevices.getUserMedia({
                video: {
                  deviceId: { ideal: localId }
                },
                audio: false
              });
            } catch (e2) {
              currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            }
          }
        } else {
          currentStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
        }

        if (video && currentStream) {
          video.srcObject = currentStream;
          video.play().catch(() => {});
        }
      } catch (err) {
        console.error('Webcam error in camera overlay:', err);
      } finally {
        isInitializing = false;
      }
    }

    function setShape(shape) {
      container.className = `cam-container shape-${shape}`;
    }

    btnCycleShape.addEventListener('click', (e) => {
      e.stopPropagation();
      currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
      const nextShape = shapes[currentShapeIndex];
      setShape(nextShape);
      if (window.electronAPI) {
        window.electronAPI.setCameraShape(nextShape);
      }
    });

    if (btnFlipCam) {
      btnFlipCam.addEventListener('click', (e) => {
        e.stopPropagation();
        isFlipped = !isFlipped;
        applyFlip();
      });
    }

    btnCloseCam.addEventListener('click', (e) => {
      e.stopPropagation();
      stopStream();
      if (window.electronAPI) {
        window.electronAPI.closeCameraOverlay();
      }
    });

    window.addEventListener('beforeunload', () => {
      stopStream();
    });

    let camBrightness = 100;
    let camSmoothness = 0;
    let camNoiseReduction = 0;

    function applyFilters() {
      if (!video) return;
      let finalBrightness = camBrightness + (camSmoothness * 0.08) + (camNoiseReduction * 0.06);
      let finalContrast = 100 + (camSmoothness * 0.05) - (camNoiseReduction * 0.08);
      let finalSaturate = 100 + (camSmoothness * 0.12) - (camNoiseReduction * 0.06);
      let microSoftness = (camSmoothness / 100) * 0.25;

      let filters = [`brightness(${finalBrightness.toFixed(1)}%)`];
      if (Math.abs(finalContrast - 100) > 0.5) filters.push(`contrast(${finalContrast.toFixed(1)}%)`);
      if (Math.abs(finalSaturate - 100) > 0.5) filters.push(`saturate(${finalSaturate.toFixed(1)}%)`);
      if (microSoftness > 0.04) filters.push(`blur(${microSoftness.toFixed(2)}px)`);

      video.style.filter = filters.join(' ');
      applyFlip();
    }

    if (window.electronAPI) {
      window.electronAPI.onStopCamFeed(() => {
        stopStream();
      });

      window.electronAPI.onInitCamSettings(({ shape, deviceId, deviceLabel }) => {
        if (shape) setShape(shape);
        initCamera(deviceId || '', deviceLabel || '');
        applyFilters();
      });

      window.electronAPI.onUpdateCamSettings(({ shape, deviceId, deviceLabel }) => {
        if (shape) setShape(shape);
        initCamera(deviceId || '', deviceLabel || '');
      });

      window.electronAPI.onUpdateCamShape((shape) => {
        if (shape) setShape(shape);
      });

      window.electronAPI.onUpdateCamBrightness((val) => {
        camBrightness = val;
        applyFilters();
      });

      window.electronAPI.onUpdateCamFilters(({ brightness, smoothness, noiseReduction }) => {
        if (typeof brightness === 'number') camBrightness = brightness;
        if (typeof smoothness === 'number') camSmoothness = smoothness;
        if (typeof noiseReduction === 'number') camNoiseReduction = noiseReduction;
        applyFilters();
      });

      window.electronAPI.onUpdateCamFlipped((flipped) => {
        isFlipped = !!flipped;
        applyFlip();
      });
    } else {
      initCamera();
    }

  </script>
</body>
</html>
