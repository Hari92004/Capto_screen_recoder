<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capto Toolbar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }

    .island-toolbar {
      width: 100%;
      height: 100%;
      background: #0f121a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0 14px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      -webkit-app-region: drag;
      cursor: grab;
      box-shadow: none;
    }

    .island-toolbar:active {
      cursor: grabbing;
    }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FF453A;
      box-shadow: 0 0 8px #FF453A;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    .timer-text {
      font-family: 'SF Mono', monospace, 'JetBrains Mono';
      font-size: 13px;
      font-weight: 700;
      color: #FFF;
      min-width: 62px;
    }

    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.18);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .tb-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tb-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }

    .tb-btn.stop {
      background: #FF453A;
      border-color: #FF453A;
    }

    .tb-btn.stop:hover {
      background: #FF6961;
    }

    .tb-btn.muted {
      background: rgba(255, 69, 58, 0.4);
      border-color: #FF453A;
      color: #FF453A;
    }
  </style>
</head>
<body>

  <div class="island-toolbar">
    <div class="rec-indicator">
      <span class="rec-dot"></span>
      <span class="timer-text" id="tb-timer">00:00:00</span>
    </div>

    <div class="divider"></div>

    <div class="toolbar-actions">
      <!-- Pause / Resume -->
      <button class="tb-btn" id="btn-pause" title="Pause / Resume">⏸</button>
      
      <!-- Mic Mute / Unmute -->
      <button class="tb-btn" id="btn-mute" title="Mute / Unmute Mic">🎙️</button>

      <!-- Snapshot -->
      <button class="tb-btn" id="btn-snapshot" title="Take Screenshot">📸</button>
      
      <!-- Stop Recording -->
      <button class="tb-btn stop" id="btn-stop" title="Stop & Save">⏹</button>
    </div>
  </div>

  <script>
    const timerElem = document.getElementById('tb-timer');
    const btnPause = document.getElementById('btn-pause');
    const btnMute = document.getElementById('btn-mute');
    const btnSnapshot = document.getElementById('btn-snapshot');
    const btnStop = document.getElementById('btn-stop');

    let isPaused = false;
    let isMuted = false;

    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPause.textContent = isPaused ? '▶' : '⏸';
      if (window.electronAPI) window.electronAPI.sendToolbarAction('pause');
    });

    btnMute.addEventListener('click', () => {
      isMuted = !isMuted;
      btnMute.textContent = isMuted ? '🔇' : '🎙️';
      if (isMuted) btnMute.classList.add('muted');
      else btnMute.classList.remove('muted');
      if (window.electronAPI) window.electronAPI.sendToolbarAction('toggle-mute');
    });

    btnSnapshot.addEventListener('click', () => {
      if (window.electronAPI) window.electronAPI.sendToolbarAction('screenshot');
    });

    btnStop.addEventListener('click', () => {
      if (window.electronAPI) window.electronAPI.sendToolbarAction('stop');
    });

    if (window.electronAPI) {
      window.electronAPI.onSyncTimer((timeStr) => {
        timerElem.textContent = timeStr;
      });
    }
  </script>
</body>
</html>
