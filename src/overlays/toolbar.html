<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capto Toolbar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }

    .island-toolbar {
      width: 100%;
      height: 100%;
      background: #0f121a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0 14px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      -webkit-app-region: drag;
      cursor: grab;
      box-shadow: none;
    }

    .island-toolbar:active {
      cursor: grabbing;
    }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FF453A;
      box-shadow: 0 0 8px #FF453A;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    .timer-text {
      font-family: 'SF Mono', monospace, 'JetBrains Mono';
      font-size: 13px;
      font-weight: 700;
      color: #FFF;
      min-width: 62px;
    }

    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.18);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .tb-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tb-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }

    .tb-btn.stop {
      background: #FF453A;
      border-color: #FF453A;
    }

    .tb-btn.stop:hover {
      background: #FF6961;
    }

    .tb-btn.muted {
      background: rgba(255, 69, 58, 0.4);
      border-color: #FF453A;
      color: #FF453A;
    }
  </style>
</head>
<body>

  <div class="island-toolbar">
    <div class="rec-indicator">
      <span class="rec-dot"></span>
      <span class="timer-text" id="tb-timer">00:00:00</span>
    </div>

    <div class="divider"></div>

    <div class="toolbar-actions">
      <!-- Pause / Resume -->
      <button class="tb-btn" id="btn-pause" title="Pause / Resume">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
      </button>
      
      <!-- Mic Mute / Unmute -->
      <button class="tb-btn" id="btn-mute" title="Mute / Unmute Mic">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
      </button>

      <!-- Camera Overlay Toggle -->
      <button class="tb-btn" id="btn-cam" title="Toggle Camera Bubble (F11)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
      </button>

      <!-- Snapshot -->
      <button class="tb-btn" id="btn-snapshot" title="Take Screenshot">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </button>
      
      <!-- Stop Recording -->
      <button class="tb-btn stop" id="btn-stop" title="Stop & Save">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
      </button>
    </div>
  </div>

  <script>
    const timerElem = document.getElementById('tb-timer');
    const btnPause = document.getElementById('btn-pause');
    const btnMute = document.getElementById('btn-mute');
    const btnCam = document.getElementById('btn-cam');
    const btnSnapshot = document.getElementById('btn-snapshot');
    const btnStop = document.getElementById('btn-stop');

    const SVG_PAUSE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';
    const SVG_PLAY = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>';
    const SVG_MIC_ON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>';
    const SVG_MIC_OFF = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>';

    let isPaused = false;
    let isMuted = false;

    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPause.innerHTML = isPaused ? SVG_PLAY : SVG_PAUSE;
      if (window.electronAPI) window.electronAPI.sendToolbarAction('pause');
    });

    btnMute.addEventListener('click', () => {
      isMuted = !isMuted;
      btnMute.innerHTML = isMuted ? SVG_MIC_OFF : SVG_MIC_ON;
      if (isMuted) btnMute.classList.add('muted');
      else btnMute.classList.remove('muted');
      if (window.electronAPI) window.electronAPI.sendToolbarAction('toggle-mute');
    });

    if (btnCam) {
      btnCam.addEventListener('click', () => {
        if (window.electronAPI) window.electronAPI.sendToolbarAction('toggle-cam');
      });
    }

    btnSnapshot.addEventListener('click', () => {
      if (window.electronAPI) window.electronAPI.sendToolbarAction('screenshot');
    });

    btnStop.addEventListener('click', () => {
      if (window.electronAPI) window.electronAPI.sendToolbarAction('stop');
    });

    if (window.electronAPI) {
      window.electronAPI.onSyncTimer((timeStr) => {
        timerElem.textContent = timeStr;
      });
    }
  </script>
</body>
</html>
