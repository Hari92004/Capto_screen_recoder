<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capto — Media Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-window {
      width: 100%;
      height: 100%;
      background: #0d1117;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    /* Window Header / Titlebar */
    .player-titlebar {
      height: 44px;
      background: rgba(20, 26, 38, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      -webkit-app-region: drag;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .brand-icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      object-fit: contain;
    }

    .media-title {
      font-size: 13px;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 500px;
    }

    .type-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(10, 132, 255, 0.2);
      color: #0A84FF;
      border: 1px solid rgba(10, 132, 255, 0.4);
    }

    .title-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 30px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }

    .win-btn.close:hover {
      background: #FF453A;
      color: #FFFFFF;
    }

    /* Media Viewport */
    .player-body {
      flex: 1;
      width: 100%;
      height: calc(100% - 44px - 40px);
      background: #05070a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
      outline: none;
    }

    img#photo-view {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Audio Viewport */
    .audio-player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 80%;
      max-width: 520px;
      padding: 30px 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .audio-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0A84FF, #5E5CE6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 8px 24px rgba(10, 132, 255, 0.4);
    }

    .audio-filename {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      word-break: break-all;
    }

    audio {
      width: 100%;
      outline: none;
      filter: invert(1) hue-rotate(180deg);
    }

    /* Footer Info Bar */
    .player-footer {
      height: 40px;
      background: rgba(18, 22, 32, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
    }

    .footer-left {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 650px;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="player-window">
    
    <!-- Titlebar -->
    <div class="player-titlebar">
      <div class="title-left">
        <img src="../assets/icon.png" class="brand-icon" alt="Capto" />
        <span class="media-title" id="media-title">Capto Media Player</span>
        <span class="type-badge" id="type-badge">VIDEO</span>
      </div>

      <div class="title-controls">
        <button class="win-btn" id="btn-min" title="Minimize">
          <svg width="11" height="2" viewBox="0 0 11 2" fill="none"><rect width="11" height="2" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" id="btn-max" title="Maximize / Restore">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button class="win-btn close" id="btn-close" title="Close (Esc)">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- Media Body -->
    <div class="player-body" id="player-body">
      <!-- Video Player -->
      <video id="video-player" controls autoplay playsinline style="display: none;"></video>

      <!-- Photo Viewer -->
      <img id="photo-player" src="" alt="Screenshot" style="display: none;" />

      <!-- Audio Player -->
      <div class="audio-player-card" id="audio-player-card" style="display: none;">
        <div class="audio-icon-wrap">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
        </div>
        <div class="audio-filename" id="audio-title">Voice Recording</div>
        <audio id="audio-player" controls autoplay></audio>
      </div>
    </div>

    <!-- Footer -->
    <div class="player-footer">
      <span class="footer-left" id="footer-path"></span>
      <div class="footer-actions">
        <button class="action-btn" id="btn-reveal" title="Show in File Explorer">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          Show in Folder
        </button>
      </div>
    </div>

  </div>

  <script>
    const mediaTitle = document.getElementById('media-title');
    const typeBadge = document.getElementById('type-badge');
    const footerPath = document.getElementById('footer-path');

    const videoPlayer = document.getElementById('video-player');
    const photoPlayer = document.getElementById('photo-player');
    const audioCard = document.getElementById('audio-player-card');
    const audioPlayer = document.getElementById('audio-player');
    const audioTitle = document.getElementById('audio-title');

    const btnMin = document.getElementById('btn-min');
    const btnMax = document.getElementById('btn-max');
    const btnClose = document.getElementById('btn-close');
    const btnReveal = document.getElementById('btn-reveal');

    let currentFilePath = '';

    btnMin.onclick = () => window.electronAPI && window.electronAPI.playerMinimize();
    btnMax.onclick = () => window.electronAPI && window.electronAPI.playerMaximize();
    btnClose.onclick = () => window.electronAPI && window.electronAPI.playerClose();

    btnReveal.onclick = () => {
      if (currentFilePath && window.electronAPI && window.electronAPI.revealFile) {
        window.electronAPI.revealFile(currentFilePath);
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.electronAPI && window.electronAPI.playerClose();
      } else if (e.key === ' ' && e.target === document.body) {
        if (videoPlayer.style.display !== 'none') {
          if (videoPlayer.paused) videoPlayer.play();
          else videoPlayer.pause();
        } else if (audioPlayer.style.display !== 'none') {
          if (audioPlayer.paused) audioPlayer.play();
          else audioPlayer.pause();
        }
      }
    });

    if (window.electronAPI && window.electronAPI.onLoadMedia) {
      window.electronAPI.onLoadMedia((data) => {
        loadMedia(data);
      });
    }

    if (window.electronAPI && window.electronAPI.playerReady) {
      window.electronAPI.playerReady();
    }

    function loadMedia(data) {
      if (!data) return;
      currentFilePath = data.filePath || '';
      mediaTitle.textContent = data.filename || 'Recording';
      footerPath.textContent = currentFilePath;

      const ext = (data.filename || '').split('.').pop().toLowerCase();
      const isPhoto = ['png', 'jpg', 'jpeg'].includes(ext);
      const isAudio = ['wav', 'mp3', 'm4a', 'ogg', 'aac'].includes(ext) || (!isPhoto && data.filename.toLowerCase().includes('voice') && !ext.includes('mp4'));
      const isVideo = !isPhoto && !isAudio;

      // Hide all first
      videoPlayer.style.display = 'none';
      videoPlayer.pause();
      photoPlayer.style.display = 'none';
      audioCard.style.display = 'none';
      audioPlayer.pause();

      let mediaUrl = data.filePath || '';
      if (mediaUrl && !mediaUrl.startsWith('file://')) {
        const normalized = mediaUrl.replace(/\\/g, '/');
        mediaUrl = normalized.startsWith('/') ? `file://${normalized}` : `file:///${normalized}`;
      }
      mediaUrl = encodeURI(mediaUrl);

      if (isVideo) {
        typeBadge.textContent = 'VIDEO (' + ext.toUpperCase() + ')';
        typeBadge.style.color = '#0A84FF';
        typeBadge.style.borderColor = 'rgba(10, 132, 255, 0.4)';
        typeBadge.style.background = 'rgba(10, 132, 255, 0.2)';
        
        videoPlayer.style.display = 'block';
        videoPlayer.src = mediaUrl;
        videoPlayer.play().catch(() => {});
      } else if (isPhoto) {
        typeBadge.textContent = 'SCREENSHOT';
        typeBadge.style.color = '#30D158';
        typeBadge.style.borderColor = 'rgba(48, 209, 88, 0.4)';
        typeBadge.style.background = 'rgba(48, 209, 88, 0.2)';

        photoPlayer.style.display = 'block';
        photoPlayer.src = mediaUrl;
      } else {
        typeBadge.textContent = 'VOICE NOTE';
        typeBadge.style.color = '#AF52DE';
        typeBadge.style.borderColor = 'rgba(175, 82, 222, 0.4)';
        typeBadge.style.background = 'rgba(175, 82, 222, 0.2)';

        audioTitle.textContent = data.filename;
        audioCard.style.display = 'flex';
        audioPlayer.src = mediaUrl;
        audioPlayer.play().catch(() => {});
      }
    }
  </script>
</body>
</html>
